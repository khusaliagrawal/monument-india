<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monuments of India</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Monuments of India</h1>
  </header>

  <main class="grid">
    <div class="card">
      <img src="taj.jpg" alt="Taj Mahal">
      <div class="info">
        <h3>Taj Mahal, Agra</h3>
      </div>
    </div>

    <div class="card">
      <img src="redfort.jpg" alt="Red Fort">
      <div class="info">
        <h3>Red Fort, Delhi</h3>
        <ul>
          <li>Location: <span class="place">New Delhi</span></li>
          <li>Built: 12 May 1639-6 April 1648; 378 years</li>
          <li>Built for Mughal Empire</li>
        </ul>
      </div>
    </div>

    <div class="card">
      <img src="gateway.jpg" alt="Gateway of India">
      <div class="info">
        <h3>Gateway of India, Mumbai</h3>
      </div>
    </div>

    <div class="card">
      <img src="qutub.jpg" alt="Qutub Minar">
      <div class="info">
        <h3>Qutub Minar, Delhi</h3>
      </div>
    </div>

    <div class="card">
      <img src="lotus.jpg" alt="Lotus Temple">
      <div class="info">
        <h3>Lotus Temple, Delhi</h3>
      </div>
    </div>

    <div class="card">
      <img src="hampi.jpg" alt="Stone chariot at Hampi">
      <div class="info">
        <h3>Hampi, Karnataka</h3>
      </div>
    </div>
  </main>
</body>

</html>
